<script>
/* Cada participante de la ruleta entra solo a LoteControl, como el formulario
   de Refiere y Gana. La ruleta guarda sus datos en este navegador (mismo
   dominio que esta página); aquí se leen y se mandan dos veces: al
   registrarse y al ganar. Si el sistema no responde, se reintenta luego. */
(() => {
  'use strict';
  const API = 'https://app.inmobiliariacasagrande.com/api/ruleta';
  const ENVIADOS = 'cg_enviados_lotecontrol';
  let ocupado = false, esperarHasta = 0;

  const leer = (clave, vacio) => {
    try { return JSON.parse(localStorage.getItem(clave)) ?? vacio; } catch (_) { return vacio; }
  };

  async function sincronizar() {
    if (ocupado || Date.now() < esperarHasta) return;
    ocupado = true;
    try {
      const enviados = leer(ENVIADOS, {});
      const lista = [].concat(leer('cg_participants_history', []), leer('cg_current_participant', null) || []);
      const porId = new Map();
      lista.forEach(p => { if (p && p.id) porId.set(p.id, Object.assign({}, porId.get(p.id), p)); });

      for (const p of porId.values()) {
        const gano = p.prizeWon && !p.prizeWon.isRetry && p.couponCode;
        const premio = gano ? (p.prizeWon.fullTitle || p.prizeWon.label || 'Premio') : '';
        const hecho = enviados[p.id] || {};
        if (hecho.premio || (!premio && hecho.registro)) continue;

        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            participanteId: p.id, nombre: p.name || '', telefono: p.phone || '',
            correo: p.email || '', premio, codigo: gano ? p.couponCode : ''
          })
        });
        // 400 = datos que el sistema no acepta: reintentar no los arregla.
        if (!r.ok && r.status !== 400) throw new Error('respuesta ' + r.status);
        enviados[p.id] = { registro: true, premio: !!premio };
        localStorage.setItem(ENVIADOS, JSON.stringify(enviados));
      }
    } catch (_) {
      esperarHasta = Date.now() + 30000;
    } finally {
      ocupado = false;
    }
  }

  addEventListener('storage', e => { if (e.key && e.key.startsWith('cg_') && e.key !== ENVIADOS) sincronizar(); });
  setInterval(sincronizar, 4000);
  sincronizar();
})();
</script>
